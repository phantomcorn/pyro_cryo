<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark">
        <title>Checkout · Pyro Cryo</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap">
        <link rel="stylesheet" th:href="@{/css/checkout.css}" href="checkout.css">
        <script th:src="@{/js/wallet.js}" defer></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.17.0/ethers.umd.min.js"></script>
        <script type="module" th:inline="javascript">
            import abiJson from "./../abi/PaymentRail.json" with { type: "json" };

            console.log("Import ethers module...Success!")
            console.log("Import ABI from contract...Success!")
            const abi = abiJson["abi"]
            const erc20Abi = [
              "function name() view returns (string)",
              "function symbol() view returns (string)",
              "function decimals() view returns (uint8)",
              "function totalSupply() view returns (uint256)",
              "function balanceOf(address owner) view returns (uint256)",
              "function transfer(address to, uint256 amount) returns (bool)",
              "function allowance(address owner, address spender) view returns (uint256)",
              "function approve(address spender, uint256 amount) returns (bool)",
              "function transferFrom(address from, address to, uint256 amount) returns (bool)",
              "event Transfer(address indexed from, address indexed to, uint256 value)",
              "event Approval(address indexed owner, address indexed spender, uint256 value)"
            ];

            async function pay() {
                console.log("User ether version: " + ethers.version)
                const domain = [[${domain}]]
                const message = {
                    id: [[${message.hashId}]],
                    tokenAddr: [[${message.tokenAddress}]],
                    amount: [[${message.amount}]],
                    merchantAddr: [[${message.merchantAddress}]],
                    deadline:  [[${deadline}]]
                }

                const contractAddress = [[${domain.verifyingContract}]]
                const tokenAddress = [[${message.tokenAddress}]]
                const amount = [[${message.amount}]]
                const signature = [[${voucher}]]


                const provider = new ethers.BrowserProvider(window.ethereum)
                const wantChainId = BigInt(domain.chainId)
                if ((await provider.getNetwork()).chainId !== wantChainId) {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x' + wantChainId.toString(16) }],
                    })
                }

                const buyer = await provider.getSigner()
                const buyerAddress = await buyer.getAddress()
                const tokenContract = new ethers.Contract(tokenAddress, erc20Abi, buyer)
                const gatewayContract = new ethers.Contract(contractAddress, abi, buyer)

                if ((await tokenContract.allowance(buyerAddress,contractAddress)) < amount) {
                    const approveTx = await tokenContract.approve(contractAddress, amount)
                    const approveReceipt = await approveTx.wait()
                }
                console.log("Approval ok")


                const tx = await gatewayContract.pay(message, domain, signature)
                const receipt = await tx.wait()
                if (receipt.status == 0) {
                    console.log("Transaction reverted")
                }

                console.log(receipt)

                document.getElementById("status").innerHTML = `PAID ${receipt.blockNumber}`;
                document.getElementById("pay-button").disabled = true;

            }
            document.getElementById("pay-button").addEventListener("click", pay);
        </script>
    </head>
    <body>
        <main class="checkout">
            <header class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                pyro_cryo
                <span class="secure">Secure checkout</span>
            </header>

            <div class="card">
                <section>
                    <h1 class="amount-label">Amount due</h1>
                    <p class="amount"><span th:text="${message.amount}">-1</span></p>
                </section>

                <section class="wallet" aria-label="Wallet">
                    <button id="connectButton" onclick="connectWallet()">Connect Wallet</button>
                    <p id="walletAddress">Not connected</p>
                </section>

                <section>
                    <dl class="details">
                        <div>
                            <dt>Merchant</dt>
                            <dd class="mono" th:text="${message.merchantAddress}">0x0000000000000000000000000000000000000000</dd>
                        </div>
                        <div>
                            <dt>Token</dt>
                            <dd class="mono" th:text="${message.tokenAddress}">0x0000000000000000000000000000000000000000</dd>
                        </div>
                        <div>
                            <dt>Expires at</dt>
                            <dd class="mono" th:text="${deadline}">0</dd>
                        </div>
                    </dl>
                </section>

                <section>
                    <details class="tech">
                        <summary>Technical details</summary>
                        <dl class="details">
                            <div>
                                <dt>Invoice ID</dt>
                                <dd class="mono" th:text="${message.invoiceId}">-1</dd>
                            </div>
                            <div>
                                <dt>Hash ID</dt>
                                <dd class="mono" th:text="${message.hashId}">-1</dd>
                            </div>
                            <div>
                                <dt>Voucher</dt>
                                <dd class="mono" th:text="${voucher}">0x0000000000000000000000000000000000000000</dd>
                            </div>
                        </dl>
                    </details>
                </section>

                <section class="pay-row">
                    <button id="pay-button">Pay</button>
                    <div id="status" role="status">NOT PAID</div>
                </section>
            </div>
        </main>
    </body>
</html>
